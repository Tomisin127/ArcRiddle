# fly.toml app configuration file generated for arcriddle on 2026-09-26T22:33:06Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'https://arcriddle.fly.dev'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size = 'shared-cpu-1x'

  [build.args]
  VITE_SELLER_ADDRESS = "0x72110c7117Ee3D0BC77D4682107EA04b02312ED6"
